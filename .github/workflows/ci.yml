name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node docs/diagrams/render-mermaid.mjs --check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest hermes_bridge.test_inventory_agent hermes_bridge.test_launch_manifest
      - run: python3 -m pip install ruff==0.15.11
      - run: python3 -m ruff check hermes_bridge
      - run: python3 -m ruff format --check hermes_bridge
